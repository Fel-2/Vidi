[package]
name = "vidi"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "A terminal UI for YouTube, Twitch and PeerTube"
repository = "https://codeberg.org/Fel/Vidi"

[[bin]]
name = "vidi"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
